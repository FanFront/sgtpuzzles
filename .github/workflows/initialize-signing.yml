name: Initialize release signing key

# One-time setup from GitHub's web UI after saving the repository secret:
# ANDROID_RELEASE_SIGNING_PASSPHRASE
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sgtpuzzles-release-signing
  cancel-in-progress: false

jobs:
  initialize:
    name: Generate and back up encrypted signing key
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out default branch
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore and persist encrypted backup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RELEASE_SIGNING_PASSPHRASE: ${{ secrets.ANDROID_RELEASE_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${ANDROID_RELEASE_SIGNING_PASSPHRASE:-}" ]]; then
            echo "::error::Missing Actions secret ANDROID_RELEASE_SIGNING_PASSPHRASE"
            exit 1
          fi
          if (( ${#ANDROID_RELEASE_SIGNING_PASSPHRASE} < 24 )); then
            echo "::error::Create an Actions secret ANDROID_RELEASE_SIGNING_PASSPHRASE with a unique, randomly generated 24+ character password."
            exit 1
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/android-release-signing" > /dev/null 2>&1; then
            echo "An encrypted signing key already exists in the android-release-signing branch."
            echo "Refusing to replace it; all future releases must use the same key."
            exit 0
          fi

          keystore="${RUNNER_TEMP}/sgtpuzzles-release.p12"
          encrypted="${RUNNER_TEMP}/release-key.p12.enc"
          trap 'rm -f "${keystore}"' EXIT

          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "${keystore}" \
            -storepass "${ANDROID_RELEASE_SIGNING_PASSPHRASE}" \
            -keypass "${ANDROID_RELEASE_SIGNING_PASSPHRASE}" \
            -alias sgtpuzzles -keyalg RSA -keysize 3072 \
            -validity 12000 -dname "CN=SGT Puzzles, OU=Android, O=FanFront"

          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -pass env:ANDROID_RELEASE_SIGNING_PASSPHRASE \
            -in "${keystore}" -out "${encrypted}"

          # Store ONLY the password-encrypted keystore on a separate permanent
          # Git branch. No plaintext keystore or passphrase is committed.
          blob=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" \
            -f content="$(base64 -w 0 "${encrypted}")" -f encoding=base64 --jq .sha)
          tree=$(jq -n --arg sha "${blob}" \
            '{tree:[{path:"release-key.p12.enc",mode:"100644",type:"blob",sha:$sha}]}' |
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)
          commit=$(jq -n --arg sha "${tree}" \
            '{message:"chore: store encrypted Android release signing key",tree:$sha,parents:[]}' |
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/android-release-signing" -f sha="${commit}" > /dev/null

          echo "Signing key initialized and encrypted backup saved to branch android-release-signing."
          echo "Keep the GitHub Actions secret ANDROID_RELEASE_SIGNING_PASSPHRASE safe. Do not delete this branch."
