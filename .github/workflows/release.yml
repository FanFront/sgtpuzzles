name: Publish Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (example: v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sgtpuzzles-release-signing
  cancel-in-progress: false

jobs:
  publish:
    name: Build, sign, and publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out release commit and history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and calculate Android version
        shell: bash
        env:
          RELEASE_INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::The release tag must point to a commit in main"
            exit 1
          fi

          tag="${SGT_RELEASE_TAG}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "::error::Choose the main branch to publish a release"
              exit 1
            fi
            tag="${RELEASE_INPUT_VERSION}"
          fi
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a semantic version tag such as v1.0.0"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          if (( ${#major} > 4 || ${#minor} > 3 || ${#patch} > 3 )); then
            echo "::error::Version too large (minor and patch must be <= 999)"
            exit 1
          fi
          version_code=$(( 10#${major} * 1000000 + 10#${minor} * 1000 + 10#${patch} ))
          if (( version_code <= 149 || version_code > 2100000000 )); then
            echo "::error::Computed versionCode ${version_code} is outside the allowed release range"
            exit 1
          fi
          echo "SGT_RELEASE_TAG=${tag}" >> "${GITHUB_ENV}"
          echo "SGT_RELEASE_VERSION_CODE=${version_code}" >> "${GITHUB_ENV}"
          echo "SGT_RELEASE_VERSION_NAME=${tag#v}" >> "${GITHUB_ENV}"
          echo "Release ${tag} -> Android versionCode ${version_code}"

      - name: Restore persistent release signing key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_RELEASE_SIGNING_PASSPHRASE: ${{ secrets.ANDROID_RELEASE_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${ANDROID_RELEASE_SIGNING_PASSPHRASE:-}" ]]; then
            echo "::error::Missing secret ANDROID_RELEASE_SIGNING_PASSPHRASE; see docs/RELEASING.md"
            exit 1
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/android-release-signing" >/dev/null 2>&1; then
            echo "::error::No signing key found. Run 'Initialize release signing key' on main first."
            exit 1
          fi
          git fetch --no-tags origin refs/heads/android-release-signing
          git show FETCH_HEAD:release-key.p12.enc > "${RUNNER_TEMP}/release-key.p12.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -pass env:ANDROID_RELEASE_SIGNING_PASSPHRASE \
            -in "${RUNNER_TEMP}/release-key.p12.enc" \
            -out "${RUNNER_TEMP}/sgtpuzzles-release.p12"
          keytool -list -storetype PKCS12 \
            -keystore "${RUNNER_TEMP}/sgtpuzzles-release.p12" \
            -storepass "${ANDROID_RELEASE_SIGNING_PASSPHRASE}" \
            -alias sgtpuzzles > /dev/null
          rm -f "${RUNNER_TEMP}/release-key.p12.enc"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools, CMake, and NDK
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build unsigned release APK and run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:testDebugUnitTest

      - name: Align, sign, and verify the release APK
        shell: bash
        env:
          ANDROID_RELEASE_SIGNING_PASSPHRASE: ${{ secrets.ANDROID_RELEASE_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          keystore="${RUNNER_TEMP}/sgtpuzzles-release.p12"
          trap 'rm -f "${keystore}"' EXIT

          shopt -s nullglob
          unsigned=(app/build/outputs/apk/release/*-unsigned.apk)
          if (( ${#unsigned[@]} != 1 )); then
            echo "::error::Expected exactly one unsigned release APK"
            exit 1
          fi
          mkdir -p dist
          apk="dist/sgtpuzzles-${SGT_RELEASE_TAG}.apk"
          tools="${ANDROID_HOME}/build-tools/36.0.0"
          "${tools}/zipalign" -P 16 -f 4 "${unsigned[0]}" "${RUNNER_TEMP}/aligned.apk"
          "${tools}/apksigner" sign \
            --ks "${keystore}" \
            --ks-key-alias sgtpuzzles \
            --ks-pass env:ANDROID_RELEASE_SIGNING_PASSPHRASE \
            --key-pass env:ANDROID_RELEASE_SIGNING_PASSPHRASE \
            --out "${apk}" "${RUNNER_TEMP}/aligned.apk"
          "${tools}/zipalign" -c -P 16 4 "${apk}"
          "${tools}/apksigner" verify --min-sdk-version 21 --verbose --print-certs "${apk}"

          badge=$("${tools}/aapt" dump badging "${apk}")
          expected="name='name.boyle.chris.sgtpuzzles' versionCode='${SGT_RELEASE_VERSION_CODE}' versionName='${SGT_RELEASE_VERSION_NAME}'"
          if [[ "${badge}" != *"${expected}"* ]]; then
            echo "::error::Release APK package or Android version does not match the tag"
            exit 1
          fi
          ( cd dist && sha256sum "sgtpuzzles-${SGT_RELEASE_TAG}.apk" > SHA256SUMS.txt )

      - name: Upload signed APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sgtpuzzles-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            gh release create "${SGT_RELEASE_TAG}" dist/* \
              --verify-tag \
              --title "SGT Puzzles ${SGT_RELEASE_TAG}" \
              --generate-notes
          else
            # GitHub creates the tag on this exact main commit; no git CLI needed.
            gh release create "${SGT_RELEASE_TAG}" dist/* \
              --target "${GITHUB_SHA}" \
              --title "SGT Puzzles ${SGT_RELEASE_TAG}" \
              --generate-notes
          fi
